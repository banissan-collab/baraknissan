# Netlify configuration for Barak Nissan Real Estate Website
# Static single-page site — no build step, no SPA rewrites.

[build]
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long cache only for stable listing image assets
[[headers]]
  for = "/the-max-images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the live page so listing/photo edits propagate immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Rental inventory and rendering change frequently; never serve stale versions
[[headers]]
  for = "/rentals-loader.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/open-rentals.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
